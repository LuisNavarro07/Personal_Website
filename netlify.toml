# Netlify builds and serves luisenavarro.com. Do not delete this file.
[build]
  command = "hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.126.3"

[context.production.environment]
  HUGO_ENV = "production"

# Pull-request previews use their own address so links work there.
[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Files that moved; old links keep working.
[[redirects]]
  from = "/uploads/cv_len.pdf"
  to = "/cv/cv_len.pdf"
  status = 301

[[redirects]]
  from = "/publication/caresact/federal_assistance_cares_act.pdf"
  to = "/publication/caresact/crf_muni_market_navarro_nov26.pdf"
  status = 301
