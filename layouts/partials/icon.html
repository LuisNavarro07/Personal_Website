{{- /* Inline SVG icon from assets/icons/<name>.svg, plus two drawn here. */ -}}
{{- $name := . -}}
{{- if eq $name "linkedin" -}}
<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.75h4v11.25H3V9.75zm6.5 0h3.83v1.54h.06c.53-1 1.84-2.06 3.79-2.06 4.05 0 4.8 2.66 4.8 6.13v5.64h-4v-5c0-1.2-.02-2.73-1.67-2.73-1.67 0-1.92 1.3-1.92 2.65V21h-4V9.75z"/></svg>
{{- else if eq $name "email" -}}
<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 2.2V17h16V7.2l-8 5.6-8-5.6zM5.4 7l6.6 4.6L18.6 7H5.4z"/></svg>
{{- else if eq $name "download" -}}
<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M11 3h2v9.6l3.3-3.3 1.4 1.4L12 16.4l-5.7-5.7 1.4-1.4 3.3 3.3V3zM4 19h16v2H4z"/></svg>
{{- else -}}
{{- with resources.Get (printf "icons/%s.svg" $name) -}}
{{- replace .Content "<svg " "<svg aria-hidden=\"true\" focusable=\"false\" " | safeHTML -}}
{{- end -}}
{{- end -}}
