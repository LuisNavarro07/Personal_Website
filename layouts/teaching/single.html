{{ define "main" }}
<article class="wrap page-body course">
  <p class="crumb"><a href="/teaching/">Teaching</a></p>
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    <p class="page-header__sub">{{ with .Params.term }}{{ . }}, {{ end }}{{ index .Params.tags 0 }}</p>
  </header>
  <div class="prose prose--wide">{{ .Content }}</div>
</article>
{{ end }}
